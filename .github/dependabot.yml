# Keeps the pinned requirements.txt (Python packages) and the actions/* pins
# in the workflows from rotting silently -- Dependabot opens a small PR when
# something pinned here has a newer release, instead of the versions aging
# until a CI or deploy failure points it out.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pin churn is the whole point here; group the small ones so the PR list
    # stays readable.
    groups:
      python-dependencies:
        patterns:
          - "*"
    # PuLP 4.x is an API rewrite (LpVariable.dicts/PULP_CBC_CMD/LpStatus
    # removed, CBC moved to an extra) and the optimizer runs in production
    # on Streamlit Cloud: the migration is a deliberate change, so stop
    # re-proposing it here until it happens. See requirements.in.
    ignore:
      - dependency-name: "pulp"
        versions: [">=4.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
