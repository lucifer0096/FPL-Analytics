name: Weekly FPL Data Collection

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC — after the weekend's gameweek fixtures have finished
    - cron: "0 6 * * 1"

jobs:
  collect:
    name: Run collector and upload snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          # Optional: set an FPL_ENTRY_ID repository secret to also snapshot a
          # manager's team history/picks. Skipped automatically if unset.
          FPL_ENTRY_ID: ${{ secrets.FPL_ENTRY_ID }}
        run: python src/collector/snapshot.py

      - name: Upload data snapshot as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpl-data-snapshot-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
