name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12+ is required: requirements.lock pins numpy==2.5.3, which
          # declares requires_python>=3.12 and ships no cp311 wheel. 3.14
          # matches the Streamlit Cloud runtime the app actually deploys on.
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile Python
        run: python -m compileall -q app src
      - name: Run deterministic tests
        run: python -m pytest -q src/model/test_boundaries.py src/collector/test_snapshot.py
