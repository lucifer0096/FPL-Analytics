[pytest]
# One meaning for a bare `pytest -q`, locally and in CI:
# - testpaths covers every directory that actually holds tests (previously
#   test_optimizer.py/test_chips.py silently collected 0 tests and the live
#   suite was only ever discovered by accident);
# - live tests (marked below) are EXCLUDED by default, since they hit FPL's
#   real API. Run them explicitly with `pytest -m live`.
testpaths = src app
addopts = -m "not live"
markers =
    live: exercises FPL's real API (run with: pytest -m live)
